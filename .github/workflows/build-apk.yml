name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships an Android SDK with accepted licenses; AGP pulls the
      # missing platform/build-tools itself, so no explicit setup-android step is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Compile and package
        run: gradle --no-daemon :app:assembleDebug

      # Run separately so an arithmetic drift in the pinned baselines cannot hide the APK.
      - name: Core logic unit tests
        if: success() || failure()
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battscan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 30
